# Copy to bitbucket-pipelines.yml in your infrastructure repository.
# Pin TERRADRIFT_VERSION to a GitHub Release tag (vX.Y.Z), not a commit SHA.
# Linux image only — TerraDrift does not publish Windows archives.
# Cloud auth: Bitbucket OpenID Connect / workspace OIDC, not long-lived keys — docs/DRIFT_SCAN_IAM.md
# Do not publish *.tfplan artifacts (plans can contain secrets). Prefer JSON reports.
#
# Schedule: Repository settings → Pipelines → Schedules → custom pipeline `terradrift-scan`.

image: ubuntu:24.04

definitions:
  caches:
    terraform-plugins: .terraform-plugin-cache

pipelines:
  custom:
    terradrift-scan:
      - step:
          name: Drift scan
          oidc: true
          caches:
            - terraform-plugins
          script:
            - export DEBIAN_FRONTEND=noninteractive
            - apt-get update
            - apt-get install -y --no-install-recommends ca-certificates curl unzip
            - export TERRADRIFT_VERSION=v1.1.1 TERRAFORM_VERSION=1.10.5
            - export TF_PLUGIN_CACHE_DIR="${BITBUCKET_CLONE_DIR}/.terraform-plugin-cache" TF_IN_AUTOMATION=true
            - curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
            - unzip -o /tmp/terraform.zip -d /usr/local/bin
            - rm /tmp/terraform.zip
            - chmod +x /usr/local/bin/terraform
            - curl -fsSLo install-terradrift.sh "https://raw.githubusercontent.com/niravraychura/terradrift/${TERRADRIFT_VERSION}/scripts/install.sh"
            - PREFIX="${HOME}/.local" bash install-terradrift.sh
            - export PATH="${HOME}/.local/bin:${PATH}"
            - mkdir -p "${TF_PLUGIN_CACHE_DIR}"
            # Optional AWS OIDC (set repository variable AWS_ROLE_ARN; do not commit keys):
            # - apt-get install -y --no-install-recommends awscli
            # - STS=$(aws sts assume-role-with-web-identity --role-arn "${AWS_ROLE_ARN}" --role-session-name "terradrift-${BITBUCKET_BUILD_NUMBER}" --web-identity-token "${BITBUCKET_STEP_OIDC_TOKEN}" --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
            # - export AWS_ACCESS_KEY_ID=$(echo "${STS}" | awk '{print $1}') AWS_SECRET_ACCESS_KEY=$(echo "${STS}" | awk '{print $2}') AWS_SESSION_TOKEN=$(echo "${STS}" | awk '{print $3}')
            - |
              terradrift scan \
                --directory ./terraform/prod \
                --workspace-root "${BITBUCKET_CLONE_DIR}" \
                --terraform-exec \
                --redact-paths
            # Keep webhook URLs in repository variables, not in this file.
