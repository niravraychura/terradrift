name: TerraDrift Scheduled Scan (OpenTofu)

# Same planner contract as Terraform: TerraDrift runs `tofu init/plan/show`
# via --terraform-bin. Pin OpenTofu, TerraDrift, and provider versions.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Download TerraDrift
        env:
          TERRADRIFT_VERSION: v0.0.0
        run: |
          curl -fsSLo terradrift.tar.gz "https://github.com/niravraychura/terradrift/releases/download/${TERRADRIFT_VERSION}/terradrift_linux_amd64.tar.gz"
          tar -xzf terradrift.tar.gz terradrift
          install -m 0755 terradrift /usr/local/bin/terradrift
      - name: Scan for OpenTofu drift
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          terradrift scan \
            --directory ./terraform/prod \
            --workspace-root "$PWD" \
            --terraform-exec \
            --terraform-bin tofu \
            --redact-paths \
            --notify slack \
            --slack-webhook-url "$SLACK_WEBHOOK_URL"
