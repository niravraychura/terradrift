name: TerraDrift Scheduled Scan (OpenTofu)

# Same planner contract as Terraform: TerraDrift runs `tofu init/plan/show`
# via --terraform-bin. Pin OpenTofu, TerraDrift, and provider versions.
#
# If state or plans are encrypted, the job needs decrypt rights. Do not upload
# *.tfplan artifacts (plans can contain secrets).
# Cloud auth: OIDC — docs/DRIFT_SCAN_IAM.md

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Cache OpenTofu providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tofu-plugins-${{ runner.os }}-
      - name: Install TerraDrift
        env:
          TERRADRIFT_VERSION: v1.1.1
        run: |
          curl -fsSLo install-terradrift.sh "https://raw.githubusercontent.com/niravraychura/terradrift/${TERRADRIFT_VERSION}/scripts/install.sh"
          PREFIX="${HOME}/.local" bash install-terradrift.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan for OpenTofu drift
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          terradrift scan \
            --directory ./terraform/prod \
            --workspace-root "$PWD" \
            --terraform-exec \
            --terraform-bin tofu \
            --redact-paths \
            --notify slack \
            --slack-webhook-url "$SLACK_WEBHOOK_URL"
