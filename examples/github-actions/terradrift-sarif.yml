name: TerraDrift SARIF

# Copy into your infra repo. Uploads scan SARIF to GitHub code scanning
# (Security → Code scanning). Pin third-party actions to SHAs.
# Cloud auth: use OIDC (id-token: write), not long-lived keys — docs/DRIFT_SCAN_IAM.md
# Do not upload *.tfplan artifacts (plans can contain secrets).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-${{ runner.os }}-
      - name: Install TerraDrift
        env:
          TERRADRIFT_VERSION: v1.1.1
        run: |
          curl -fsSLo install-terradrift.sh "https://raw.githubusercontent.com/niravraychura/terradrift/${TERRADRIFT_VERSION}/scripts/install.sh"
          PREFIX="${HOME}/.local" bash install-terradrift.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan for Terraform drift
        id: scan
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
        run: |
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          set +e
          terradrift scan \
            --directory ./terraform/prod \
            --workspace-root "$PWD" \
            --terraform-exec \
            --redact-paths \
            --output sarif > terradrift.sarif
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF
        if: hashFiles('terradrift.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: terradrift.sarif
          category: terradrift
      - name: Propagate scan outcome
        if: steps.scan.outputs.status != '0'
        run: exit "${{ steps.scan.outputs.status }}"
