name: TerraDrift Scheduled Scan

# Copy into your infra repo. Pin third-party actions to SHAs.
# Cloud auth: use OIDC (id-token: write), not long-lived keys — docs/DRIFT_SCAN_IAM.md
# GitHub delivery: add `issues: write` for --github-issue-after, `pull-requests: write` for --github-pr.
# Do not upload *.tfplan artifacts (plans can contain secrets). Prefer JSON reports.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  id-token: write
  # issues: write  # required for --github-issue-after

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # Optional OIDC, for example:
      # - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      #   with:
      #     role-to-assume: arn:aws:iam::ACCOUNT_ID:role/terradrift-readonly
      #     aws-region: us-east-1
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-${{ runner.os }}-
      - name: Install TerraDrift
        env:
          TERRADRIFT_VERSION: v0.4.1
        run: |
          curl -fsSLo install-terradrift.sh "https://raw.githubusercontent.com/niravraychura/terradrift/${TERRADRIFT_VERSION}/scripts/install.sh"
          PREFIX="${HOME}/.local" bash install-terradrift.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan for Terraform drift
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          # Persistent GitHub issues: uncomment issues: write above, then add
          # --history-dir .terradrift-history --github-repository "${{ github.repository }}"
          # --github-issue-after 3 --github-issue-label terradrift
          terradrift scan \
            --directory ./terraform/prod \
            --workspace-root "$PWD" \
            --terraform-exec \
            --redact-paths \
            --notify slack \
            --slack-webhook-url "$SLACK_WEBHOOK_URL"
