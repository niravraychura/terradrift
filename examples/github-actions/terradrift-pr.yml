name: TerraDrift Pull Request Scan

# Upserts one TerraDrift comment on the PR (<!-- terradrift-pr-comment -->).
# Requires pull-requests: write so GITHUB_TOKEN can create/update the comment.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Download TerraDrift
        env:
          TERRADRIFT_VERSION: v0.0.0
        run: |
          curl -fsSLo terradrift.tar.gz "https://github.com/niravraychura/terradrift/releases/download/${TERRADRIFT_VERSION}/terradrift_linux_amd64.tar.gz"
          tar -xzf terradrift.tar.gz terradrift
          install -m 0755 terradrift /usr/local/bin/terradrift
      - name: Scan and upsert PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terradrift scan \
            --directory ./terraform/prod \
            --workspace-root "$PWD" \
            --terraform-exec \
            --redact-paths \
            --github-repository "${{ github.repository }}" \
            --github-pr "${{ github.event.pull_request.number }}"
