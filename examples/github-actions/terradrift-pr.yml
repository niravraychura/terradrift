name: TerraDrift Pull Request Scan

# Upserts one TerraDrift comment on the PR (<!-- terradrift-pr-comment -->).
# Requires pull-requests: write so GITHUB_TOKEN can create/update the comment.
# Cloud auth: use OIDC (id-token: write), not a PAT — docs/DRIFT_SCAN_IAM.md
# Do not upload *.tfplan artifacts.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-${{ runner.os }}-
      - name: Install TerraDrift
        env:
          TERRADRIFT_VERSION: v1.0.0
        run: |
          curl -fsSLo install-terradrift.sh "https://raw.githubusercontent.com/niravraychura/terradrift/${TERRADRIFT_VERSION}/scripts/install.sh"
          PREFIX="${HOME}/.local" bash install-terradrift.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Scan and upsert PR comment
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          terradrift scan \
            --directory ./terraform/prod \
            --workspace-root "$PWD" \
            --terraform-exec \
            --redact-paths \
            --github-repository "${{ github.repository }}" \
            --github-pr "${{ github.event.pull_request.number }}"
