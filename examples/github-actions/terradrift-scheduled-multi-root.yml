name: TerraDrift Scheduled Multi-Root Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Download TerraDrift
        env:
          TERRADRIFT_VERSION: v0.0.0
        run: |
          curl -fsSLo terradrift.tar.gz "https://github.com/niravraychura/terradrift/releases/download/${TERRADRIFT_VERSION}/terradrift_linux_amd64.tar.gz"
          tar -xzf terradrift.tar.gz terradrift
          install -m 0755 terradrift /usr/local/bin/terradrift
      - name: Multi-root drift scan with Slack and severity gate
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set +e
          terradrift scan-all \
            --manifest examples/multi-root/terraform-roots.json \
            --config examples/multi-root/terradrift.json \
            --terraform-exec \
            --workspace-root "$PWD" \
            --redact-paths \
            --concurrency 2 \
            --notify slack \
            --slack-webhook-url "$SLACK_WEBHOOK_URL" \
            --history-dir .terradrift-history \
            --output json | tee terradrift-aggregate.json
          status=$?
          set -e
          # Exit 2 = drift/changes detected. Treat findings below "high" as soft
          # by filtering aggregate JSON when you need a custom gate; default fails on any drift.
          if [ "$status" -eq 1 ]; then
            echo "scan failed"
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            python3 - <<'PY'
          import json, sys
          report = json.load(open("terradrift-aggregate.json"))
          high_or_worse = {"high", "critical"}
          for root in report.get("roots", []):
              if root.get("error"):
                  sys.exit(1)
              for change in root.get("report", {}).get("resource_changes", []):
                  risk = (change.get("risk_level") or "").lower()
                  if risk in high_or_worse:
                      print(f"failing on {change.get('address')} severity={risk}")
                      sys.exit(2)
          print("drift present but below high severity threshold")
          sys.exit(0)
          PY
          fi
