name: TerraDrift Scheduled Multi-Root Scan

# Cloud auth: OIDC — docs/DRIFT_SCAN_IAM.md
# GitHub delivery: add `issues: write` / `pull-requests: write` when using those flags.
# Do not upload *.tfplan artifacts.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  id-token: write
  # issues: write  # required for --github-issue-after

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-${{ runner.os }}-
      - name: Install TerraDrift
        env:
          TERRADRIFT_VERSION: v0.4.1
        run: |
          curl -fsSLo install-terradrift.sh "https://raw.githubusercontent.com/niravraychura/terradrift/${TERRADRIFT_VERSION}/scripts/install.sh"
          PREFIX="${HOME}/.local" bash install-terradrift.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Multi-root drift scan with Slack and severity gate
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          set +e
          terradrift scan-all \
            --manifest examples/multi-root/terraform-roots.json \
            --config examples/multi-root/terradrift.json \
            --terraform-exec \
            --workspace-root "$PWD" \
            --redact-paths \
            --concurrency 2 \
            --notify slack \
            --slack-webhook-url "$SLACK_WEBHOOK_URL" \
            --history-dir .terradrift-history \
            --output json | tee terradrift-aggregate.json
          status=$?
          set -e
          # Exit 2 = drift/changes detected. Treat findings below "high" as soft
          # by filtering aggregate JSON when you need a custom gate; default fails on any drift.
          if [ "$status" -eq 1 ]; then
            echo "scan failed"
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            python3 - <<'PY'
          import json, sys
          report = json.load(open("terradrift-aggregate.json"))
          high_or_worse = {"high", "critical"}
          for root in report.get("roots", []):
              if root.get("error"):
                  sys.exit(1)
              for change in root.get("report", {}).get("resource_changes", []):
                  risk = (change.get("risk_level") or "").lower()
                  if risk in high_or_worse:
                      print(f"failing on {change.get('address')} severity={risk}")
                      sys.exit(2)
          print("drift present but below high severity threshold")
          sys.exit(0)
          PY
          fi
