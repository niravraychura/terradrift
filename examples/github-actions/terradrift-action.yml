name: TerraDrift Official Action

# Preferred install path. Pin `uses:` to a release tag that includes action.yml
# (v0.4.0+). Empty `version:` then installs that tag.
#
# Always passes --terraform-exec. Fails if terraform/tofu is missing.
# Extra flags: `args: --github-pr ...` (GITHUB_TOKEN is already in the job env).
# Cloud auth: OIDC — docs/DRIFT_SCAN_IAM.md
# Do not upload *.tfplan artifacts.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  drift-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Drift scan
        uses: niravraychura/terradrift@v1.1.0
        with:
          directory: ./terraform/prod
