# Copy to `.gitlab-ci.yml` in your infrastructure repository (or `include:` it).
# Create the cron under CI/CD → Schedules. Run pipeline from the UI for a one-off.
# Cloud auth: GitLab OIDC (`id_tokens`), not long-lived keys — docs/DRIFT_SCAN_IAM.md
# Do not upload *.tfplan artifacts (plans can contain secrets). Prefer JSON reports.
#
# Pin the image digest in production. Pin TERRADRIFT_VERSION to a GitHub Release tag (vX.Y.Z), not a commit SHA.

stages:
  - scan

variables:
  TERRADRIFT_VERSION: "v1.1.1"
  TERRAFORM_VERSION: "1.10.5"
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform-plugin-cache"
  TF_IN_AUTOMATION: "true"

drift-scan:
  stage: scan
  image: ubuntu:24.04
  timeout: 20 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  cache:
    key: terraform-plugins
    paths:
      - .terraform-plugin-cache/
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl unzip
    - curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
    - unzip /tmp/terraform.zip -d /usr/local/bin
    - rm /tmp/terraform.zip
    - chmod +x /usr/local/bin/terraform
    - curl -fsSLo install-terradrift.sh "https://raw.githubusercontent.com/niravraychura/terradrift/${TERRADRIFT_VERSION}/scripts/install.sh"
    - PREFIX="${HOME}/.local" bash install-terradrift.sh
    - export PATH="${HOME}/.local/bin:${PATH}"
    - mkdir -p "${TF_PLUGIN_CACHE_DIR}"
    # Optional AWS OIDC (set CI/CD variable ROLE_ARN; do not commit keys):
    # - apt-get install -y --no-install-recommends awscli
    # - STS=$(aws sts assume-role-with-web-identity --role-arn "${ROLE_ARN}" --role-session-name "terradrift-${CI_PIPELINE_ID}" --web-identity-token "${GITLAB_OIDC_TOKEN}" --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
    # - export AWS_ACCESS_KEY_ID=$(echo "${STS}" | awk '{print $1}') AWS_SECRET_ACCESS_KEY=$(echo "${STS}" | awk '{print $2}') AWS_SESSION_TOKEN=$(echo "${STS}" | awk '{print $3}')
  script:
    - |
      terradrift scan \
        --directory ./terraform/prod \
        --workspace-root "${CI_PROJECT_DIR}" \
        --terraform-exec \
        --redact-paths
